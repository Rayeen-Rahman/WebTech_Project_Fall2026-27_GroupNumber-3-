<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User | Campus Event Board</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/add-user.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="banner">
            <img src="Image/Campus Event Board Banner.png" alt="Campus Event Board Banner">
        </div>

        <nav class="topnav">
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="review-event.html">Review Events</a>
            <a href="add-event.html">Add Event</a>
            <a href="add-user.html" class="active">Add User</a>
            <a href="notice.html">Notice</a>
        </nav>

        <h2>Add User</h2>

        <form class="add-user-form" onsubmit="return validateUser()" onreset="clearAllErrors()">

            <fieldset>
                <legend>User Information</legend>
                <table>
                    <tr>
                        <td><label for="FullName">Full Name :</label></td>
                        <td>
                            <input type="text" id="FullName" placeholder="Enter Full Name">
                            <p class="error" id="FullNameError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="UserID">User ID :</label></td>
                        <td>
                            <input type="text" id="UserID" placeholder="Example: USR-1234">
                            <p class="error" id="UserIDError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="Email">Email :</label></td>
                        <td>
                            <input type="text" id="Email" placeholder="Enter Email Address">
                            <p class="error" id="EmailError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="Phone">Phone :</label></td>
                        <td>
                            <input type="text" id="Phone" placeholder="01XXXXXXXXX">
                            <p class="error" id="PhoneError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="UserType">User Type :</label></td>
                        <td>
                            <select id="UserType">
                                <option value="">Select User Type</option>
                                <option value="Organizer">Organizer</option>
                                <option value="Student">Student</option>
                            </select>
                            <p class="error" id="UserTypeError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Account Information</legend>
                <table>
                    <tr>
                        <td><label for="Username">Username :</label></td>
                        <td>
                            <input type="text" id="Username" placeholder="Enter Username">
                            <p class="error" id="UsernameError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="Password">Password :</label></td>
                        <td>
                            <input type="password" id="Password" placeholder="Enter Password">
                            <p class="error" id="PasswordError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="ConfirmPassword">Confirm Password :</label></td>
                        <td>
                            <input type="password" id="ConfirmPassword" placeholder="Confirm Password">
                            <p class="error" id="ConfirmPasswordError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Add User">
            <input type="reset" id="reset" value="Reset">

        </form>

        <footer>
            <p>Campus Event Board | Admin Portal</p>
        </footer>

    </div>
</body>
</html>
