<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notice | Campus Event Board</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/notice.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="banner">
            <img src="Image/Campus Event Board Banner.png" alt="Campus Event Board Banner">
        </div>

        <nav class="topnav">
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="review-event.html">Review Events</a>
            <a href="add-event.html">Add Event</a>
            <a href="add-user.html">Add User</a>
            <a href="notice.html" class="active">Notice</a>
        </nav>

        <h2>Admin Notice</h2>

        <form class="notice-form" onsubmit="return validateNotice()" onreset="clearAllErrors()">

            <fieldset>
                <legend>Notice Information</legend>
                <table>
                    <tr>
                        <td><label for="NoticeTitle">Notice Title :</label></td>
                        <td>
                            <input type="text" id="NoticeTitle" placeholder="Enter Notice Title">
                            <p class="error" id="NoticeTitleError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="TargetAudience">Target Audience :</label></td>
                        <td>
                            <select id="TargetAudience">
                                <option value="">Select Audience</option>
                                <option value="All Users">All Users</option>
                                <option value="Students">Students</option>
                                <option value="Organizers">Organizers</option>
                            </select>
                            <p class="error" id="TargetAudienceError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="Priority">Priority :</label></td>
                        <td>
                            <select id="Priority">
                                <option value="">Select Priority</option>
                                <option value="Normal">Normal</option>
                                <option value="Important">Important</option>
                                <option value="Urgent">Urgent</option>
                            </select>
                            <p class="error" id="PriorityError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="PublishDate">Publish Date :</label></td>
                        <td>
                            <input type="date" id="PublishDate">
                            <p class="error" id="PublishDateError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="ExpiryDate">Expiry Date :</label></td>
                        <td>
                            <input type="date" id="ExpiryDate">
                            <p class="error" id="ExpiryDateError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="NoticeMessage">Notice Message :</label></td>
                        <td>
                            <textarea id="NoticeMessage" rows="6" placeholder="Write your notice message"></textarea>
                            <p class="error" id="NoticeMessageError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Publish Notice">
            <input type="reset" id="reset" value="Reset">

        </form>

        <footer>
            <p>Campus Event Board | Admin Portal</p>
        </footer>

    </div>
</body>
</html>
