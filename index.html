
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Board</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <header>
            <img src="image/Campus Event Board Banner.png" alt="Campus Event Board Banner">
        </header>

        <h2>Select Your Role</h2>

        <div class="role-container">

            <div class="role-card">

                <img src="image/Admin.jpg" alt="Admin Profile" class="role-image">

                <h3>Admin</h3>

                <p>Manage the platform</p>

                <a href="Admin/login.html" class="profile-btn">
                    View Profile →
                </a>

            </div>

            <div class="role-card">

                <img src="image/Organizer.jpg" alt="Organizer Profile" class="role-image">

                <h3>Organizer</h3>

                <p>Create and manage events</p>

                <a href="Organizer/organizer-login.html" class="profile-btn">
                 View Profile →
                 </a>

            </div>

            <div class="role-card">

                <img src="image/student.png" alt="Student Profile" class="role-image">

                <h3>Student</h3>

                <p>Explore university events</p>

                <a href="Student/student.html" class="profile-btn">
                    View Profile →
                </a>

            </div>

            <div class="role-card">

                <img src="image/Guest.png" alt="Guest Profile" class="role-image guest-image">

                <h3>Guest</h3>

                <p>Browse public events</p>

                <a href="Guest/index.html" class="profile-btn">
                    View Profile →
                </a>

            </div>

        </div>

        <footer>
            <p>Campus Event Board | University Event Management System</p>
        </footer>

    </div>

</body>

</html>
